schema_version: 1

context:
  name: son
  version: "0.4.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/son-${{ version }}.tar.gz
  sha256: d4f7afb24e9b532b428d6ef35a3bd778ad93e0c97b7f5e72857dc2b0d8439ae5

build:
  number: 4
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry >=0.12
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }}
    - lz >=0.11.0,<0.12.0

tests:
  - python:
      imports:
        - son
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Tools to read and write .son files
  license: MIT
  license_file: LICENSE
  homepage: https://flokno.github.io/son/

extra:
  recipe-maintainers:
    - jan-janssen
